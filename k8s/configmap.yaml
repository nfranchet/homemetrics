apiVersion: v1
kind: ConfigMap
metadata:
  name: homemetrics-config
data:
  DB_HOST: "timescaledb.example.internal"
  DB_PORT: "5432"
  DB_NAME: "homemetrics"
  DB_USERNAME: "homemetrics"
  SCHEDULER_ENABLED: "true"
  SCHEDULER_TIMES: "02:00,14:00"
  DATA_DIR: "/var/lib/homemetrics/data"
  GMAIL_CREDENTIALS_PATH: "/etc/homemetrics/gmail/credentials.json"
  GMAIL_TOKEN_CACHE_PATH: "/var/lib/homemetrics/gmail-token-cache.json"
  RUST_LOG: "info"
