apiVersion: apps/v1
kind: Deployment
metadata:
  name: homemetrics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homemetrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homemetrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: initialize-oauth-token-cache
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -s /state/gmail-token-cache.json ]; then
                cp /seed/token-cache.json /state/gmail-token-cache.json
              fi
              mkdir -p /state/data
              chmod 0600 /state/gmail-token-cache.json
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: state
              mountPath: /state
            - name: oauth-seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: homemetrics
          image: ghcr.io/nfranchet/homemetrics:0.0.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: homemetrics-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homemetrics-secrets
                  key: DB_PASSWORD
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homemetrics-secrets
                  key: SLACK_BOT_TOKEN
                  optional: true
            - name: SLACK_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: homemetrics-secrets
                  key: SLACK_CHANNEL_ID
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: oauth-credentials
              mountPath: /etc/homemetrics/gmail
              readOnly: true
            - name: state
              mountPath: /var/lib/homemetrics
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: oauth-credentials
          secret:
            secretName: homemetrics-secrets
            items:
              - key: credentials.json
                path: credentials.json
        - name: oauth-seed
          secret:
            secretName: homemetrics-secrets
            items:
              - key: token-cache.json
                path: token-cache.json
        - name: state
          persistentVolumeClaim:
            claimName: homemetrics-state
        - name: tmp
          emptyDir: {}
