apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homemetrics
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: homemetrics-secrets
    kind: ClusterSecretStore
  target:
    name: homemetrics-secrets
    creationPolicy: Owner
  data:
    - secretKey: credentials.json
      remoteRef:
        key: HomeMetrics/gmail_credentials.json
    - secretKey: token-cache.json
      remoteRef:
        key: HomeMetrics/gmail_cache-token.json
    - secretKey: DB_PASSWORD
      remoteRef:
        key: HomeMetrics/db_password
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: HomeMetrics/slack_bot_token
    - secretKey: SLACK_CHANNEL_ID
      remoteRef:
        key: HomeMetrics/slack_channel_id
