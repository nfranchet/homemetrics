apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homemetrics
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: homemetrics-secrets
    kind: ClusterSecretStore
  target:
    name: homemetrics-secrets
    creationPolicy: Owner
  data:
    - secretKey: credentials.json
      remoteRef:
        key: homemetrics/production
        property: gmail-credentials-json
    - secretKey: token-cache.json
      remoteRef:
        key: homemetrics/production
        property: gmail-token-cache-json
    - secretKey: DB_PASSWORD
      remoteRef:
        key: homemetrics/production
        property: db-password
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: homemetrics/production
        property: slack-bot-token
    - secretKey: SLACK_CHANNEL_ID
      remoteRef:
        key: homemetrics/production
        property: slack-channel-id
